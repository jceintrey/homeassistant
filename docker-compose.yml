services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:2026.9.1
    restart: unless-stopped
    environment:
      - TZ=Europe/Paris
    volumes:
      - ./config:/config
    networks:
      - homeassistant_network
    ports:
      - "127.0.0.1:8123:8123"

networks:
  homeassistant_network:
    external: true
